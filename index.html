<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XEUS Menu</title>
  <style>
    @import"https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap";@import"https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap";@import"https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap";:root {
    --menu-color: 0, 75, 30;
    :root {
    --menu-color: 0, 75, 30;
    /* NEW menu position variables */
    --menu-x: 50vw;
    --menu-y: 50%;
}
}
.Desc {
    position: absolute;
    display: flex;
    left: 50%;
    bottom: 4vw;
    transform: translate(-50%);
    width: auto;
    height: 1.3021vw;
    background-color: #000c;
    border-radius: .2604vw;
    padding: 14px;
    font-family: Inter;
    font-weight: 180;
    font-size: .651vw;
    color: #fff;
    justify-content: center;
    align-items: center
}
.Desc span {
    margin-bottom: .0521vw
}
.PWrapper {
    position: absolute;
    display: flex;
    left: var(--menu-x);
    top: var(--menu-y);
    transform: translate(5%, 5%);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: Inter
}
.PWrapper .PElements {
    position: relative;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-direction: row;
    gap: .2604vw
}
/* === SCROLLBAR CONTAINER === */
.PWrapper .PElements .PScroll {
    position: absolute;
    display: flex;
    right: -1vw;                  /* moved slightly right */
    width: .72vw;                 /* THICKER SCROLLBAR */
    height: 100%;
    background: #050505e6;        /* cleaner dark background */
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;
    gap: .15vw;
    border-radius: .20vw;
    /* embedded, carved look */
    box-shadow:
        inset 0 0 .22vw rgba(0,0,0,0.8),
        0 0 .35vw rgba(0,0,0,0.5);
}
/* === ARROW ICONS (UP/DOWN) === */
.PWrapper .PElements .PScroll i {
    font-size: .62vw;
    color: rgba(255,255,255,0.75);
    opacity: 0.85;
    /* makes sure arrows don’t clip */
    margin-top: .15vw;
    margin-bottom: .15vw;
    text-shadow: 0 0 .25vw rgba(0,0,0,0.8);
}
/* === SCROLLABLE ZONE (track) === */
.PWrapper .PElements .PScroll .PSProgressWrapper {
    position: relative;
    display: flex;
    width: .32vw;                 /* thicker track */
    height: 90%;
    justify-content: center;
    align-items: flex-start;
}
/* === SCROLLBAR THUMB (moving bar) === */
.PWrapper .PElements .PScroll .PSProgress {
    position: relative;
    display: flex;
    width: .32vw;                 /* matches thicker track */
    margin-top: .20vw;
    background: rgb(var(--menu-color));
    border-radius: .20vw;
    /* Clean neon green glow */
    box-shadow:
        0 0 .25vw rgba(var(--menu-color),0.9),
        0 0 .15vw rgba(var(--menu-color),0.8);
    transition: top .25s ease, height .25s ease;
}
.PWrapper .PElements .PRightElements {
    position: relative;
    display: flex;
    width: 19.0104vw;
    justify-content: center;
    align-items: center;
    flex-direction: column
}
